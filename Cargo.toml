[package]
name = "poodpim"
version = "1.0.2-rc.5"
edition = "2024"
license = "MIT"
default-run = "poodpim"

[features]
default = ["desktop"]
# Menu-bar / tray dictation app (macOS, Windows).
# ONNX Runtime linked statically (prebuilt by the ort crate).
desktop = ["ort/download-binaries", "dep:arboard", "dep:cpal", "dep:tao", "dep:tray-icon", "dep:ureq", "dep:zip"]
# AWS Lambda transcription server (Linux, Function URL).
# ONNX Runtime loaded at run time from $ORT_DYLIB_PATH (Microsoft's official build, set in the image),
# because the prebuilt static library needs a newer libstdc++ than Amazon Linux 2023 has.
lambda = ["ort/load-dynamic", "dep:lambda_http", "dep:tokio"]

[[bin]]
name = "poodpim"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "poodpim-lambda"
path = "src/bin/poodpim-lambda.rs"
required-features = ["lambda"]

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
hound = "3.5.1"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "tls-native", "api-31"] }
realfft = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

arboard = { version = "3.7.0", optional = true }
cpal = { version = "0.18.2", optional = true }
tao = { version = "0.37.2", optional = true }
tray-icon = { version = "0.26.1", optional = true }
ureq = { version = "3.5.2", default-features = false, features = ["native-tls"], optional = true }
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

lambda_http = { version = "1.3.2", optional = true }
tokio = { version = "1.54.1", features = ["macros", "rt"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[dev-dependencies]
sha2 = "0.11.0"

[target."cfg(windows)".dependencies]
sha2 = "0.11.0"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true
