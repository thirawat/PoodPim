<!doctype html>
<!--
  The README demo (assets/demo.gif), drawn frame by frame: render(t) shows the scene at t
  seconds, and scripts/make-demo.sh captures it with headless Chrome. Two scenes:
  1. hold to talk: the pill shows the words heard so far, the sentence is pasted on release;
  2. tap (hands-free): each part is typed as soon as the speaker pauses, tap again to finish.
  Mirrors the real app: the pill's size, colours, bar formulas and preview (re-transcribed every
  0.7 s, its last 42 characters) come from src/overlay.rs and src/app.rs; the menu-bar mic turns
  red while recording; the texts are the app's actual output (1.0.5) for tests/audio/th1.wav
  and for the start of one test clip and the end of another (GPU / Nvidia / code).
-->
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #E8EEF6;
    --muted: #8A9BB4;
    --teal: #2EE6C9;
    --pill: rgba(28, 28, 31, 0.92);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 960px; height: 540px; overflow: hidden; }
  body {
    font-family: "IBM Plex Sans Thai", "Sukhumvit Set", "Thonburi", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(620px 420px at 12% 0%, rgba(46, 230, 201, 0.22), transparent 70%),
      radial-gradient(700px 480px at 100% 100%, rgba(79, 70, 229, 0.28), transparent 70%),
      linear-gradient(160deg, #0B1626 0%, #0A1020 100%);
    position: relative;
  }

  /* menu bar */
  .menubar {
    position: absolute; inset: 0 0 auto 0; height: 30px;
    background: rgba(255, 255, 255, 0.07);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 0 18px;
    font-size: 13px; color: rgba(232, 238, 246, 0.82);
  }
  .menubar .dot { width: 15px; height: 10px; border-radius: 3px; background: rgba(255,255,255,0.28); }
  .menubar .mic { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; }
  .menubar .mic.on { background: rgba(229, 57, 53, 0.18); }
  .menubar .mic svg { width: 16px; height: 16px; }

  /* the app being typed into */
  .window {
    position: absolute; left: 170px; top: 62px; width: 620px; height: 262px;
    background: #FBFBFD; color: #1D2433; border-radius: 14px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.06);
    overflow: hidden;
  }
  .titlebar {
    height: 40px; display: flex; align-items: center; padding: 0 16px; gap: 8px;
    background: #F1F3F7; border-bottom: 1px solid #E3E7EE; position: relative;
  }
  .titlebar i { width: 12px; height: 12px; border-radius: 50%; background: #D3D8E1; display: block; }
  .titlebar span { position: absolute; left: 0; right: 0; text-align: center; font-size: 14px; color: #6B7487; font-weight: 500; }
  .doc { padding: 22px 30px; font-size: 21px; line-height: 1.65; }
  .doc h3 { font-size: 15px; font-weight: 600; color: #8A93A6; letter-spacing: 0.02em; margin-bottom: 6px; }
  .caret { display: inline-block; width: 2px; height: 1.15em; background: #2563EB; vertical-align: -0.2em; margin-left: 1px; }

  /* what is being said */
  .speech {
    position: absolute; left: 50%; top: 346px; transform: translateX(-50%);
    width: 760px; text-align: center; font-size: 20px; font-weight: 500;
  }
  .speech .who { color: var(--teal); font-weight: 600; margin-right: 10px; font-size: 15px; letter-spacing: 0.04em; }
  .speech .said { color: #FFFFFF; }
  .speech .unsaid { color: rgba(232, 238, 246, 0.18); }

  /* the overlay pill (src/overlay.rs) */
  .pill {
    position: absolute; left: 50%; top: 446px; height: 44px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px; padding: 0 18px;
    background: var(--pill); border-radius: 22px; white-space: nowrap;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.07);
    font-size: 14px; font-weight: 500; color: #FFFFFF;
  }
  .bars { display: flex; align-items: center; gap: 3.5px; height: 24px; }
  .bars b { width: 4px; border-radius: 2px; display: block; }

  /* the key */
  .key {
    position: absolute; left: 44px; top: 430px; width: 132px; height: 66px; border-radius: 14px;
    background: linear-gradient(180deg, #2A3448, #1E2636);
    box-shadow: 0 6px 0 #121826, 0 12px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    display: flex; flex-direction: column; justify-content: center; padding: 0 14px;
  }
  .key .sym { font-size: 22px; line-height: 1; color: #FFFFFF; }
  .key .name { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .key.down {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #121826, 0 6px 14px rgba(0, 0, 0, 0.4), 0 0 0 3px rgba(46, 230, 201, 0.55), 0 0 26px rgba(46, 230, 201, 0.35);
  }

  .keynote { position: absolute; left: 44px; top: 510px; width: 132px; text-align: center; font-size: 12px; color: var(--muted); }

  /* steps */
  .steps { position: absolute; right: 40px; top: 436px; display: flex; flex-direction: column; gap: 6px; }
  .step { display: flex; align-items: center; gap: 10px; font-size: 15px; color: rgba(232, 238, 246, 0.35); font-weight: 500; }
  .step em { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.08); }
  .step.on { color: #FFFFFF; }
  .step.on em { background: var(--teal); color: #052A26; }
  .step.done { color: rgba(232, 238, 246, 0.6); }
  .step.done em { background: rgba(46, 230, 201, 0.35); color: #052A26; }
  .scene {
    position: absolute; left: 170px; top: 38px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--teal); padding: 1px 10px; border-radius: 10px; border: 1px solid rgba(46, 230, 201, 0.45);
  }
  .doc .part { border-radius: 4px; }
  .doc .part.flash { background: rgba(46, 230, 201, 0.22); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="menubar">
    <div class="dot"></div><div class="dot"></div>
    <div class="mic" id="mic">
      <svg viewBox="0 0 36 36"><g id="micg" fill="#FFFFFF">
        <rect x="13.3" y="4.2" width="9.4" height="16" rx="4.7"/>
        <path d="M8.7 16.6v.6a9.3 9.3 0 0 0 18.6 0v-.6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" id="micring"/>
        <rect x="16.75" y="25.6" width="2.5" height="5.4" rx="1"/>
        <rect x="11.2" y="29.7" width="13.6" height="2.5" rx="1.2"/>
      </g></svg>
    </div>
    <span>09:41</span>
  </div>

  <div class="scene" id="scene"></div>

  <div class="window">
    <div class="titlebar"><i></i><i></i><i></i><span>โน้ต</span></div>
    <div class="doc">
      <h3 id="doctitle"></h3>
      <div><span id="typed"></span><span class="caret" id="caret"></span></div>
    </div>
  </div>

  <div class="speech" id="speech"><span class="who">พูดว่า</span><span class="said" id="said"></span><span class="unsaid" id="unsaid"></span></div>

  <div class="pill" id="pill"><div class="bars" id="bars"><b></b><b></b><b></b><b></b><b></b></div><span id="label"></span></div>

  <div class="key" id="key"><div class="sym">⌥</div><div class="name">Option ขวา</div></div>
  <div class="keynote">Windows: Alt ขวา</div>

  <div class="steps">
    <div class="step" id="s1"><em>1</em><span></span></div>
    <div class="step" id="s2"><em>2</em><span></span></div>
    <div class="step" id="s3"><em>3</em><span></span></div>
  </div>

<script>
  // Two scenes, one after the other; times in seconds from the start of each scene.
  // listen: when the mic is on; key: when the key is down; parts: what is said (from..to) and
  // what the app typed for it, at `typed` (hands-free: when the speaker paused; else on release).
  const SCENES = [
    {
      len: 8.6, title: "แบบกดค้าง", doc: "โน้ตด่วน",
      steps: ["กดค้าง", "พูดไทย", "ปล่อย → พิมพ์ให้เลย"],
      key: [[0.9, 4.6]], listen: [0.9, 4.6], paste: 5.35, gone: 6.4, handsfree: false,
      parts: [{
        said: "สวัสดีครับ วันนี้อากาศดีมาก ผมอยากทดสอบระบบถอดเสียงภาษาไทย",
        // The app's output for tests/audio/th1.wav (the model writes no spaces).
        text: "สวัสดีครับวันนี้อากาศดีมากผมอยากทดสอบระบบถอดเสียงภาษาไทย",
        from: 1.15, to: 4.3, typed: 5.35,
      }],
    },
    {
      len: 10.4, title: "แบบแตะ: พิมพ์ระหว่างพูด", doc: "โน้ตประชุม",
      steps: ["แตะครั้งเดียว", "พูดยาวๆ → พิมพ์ทีละช่วง", "แตะอีกครั้งเพื่อจบ"],
      key: [[0.8, 0.95], [7.9, 8.05]], listen: [0.8, 7.9], paste: 8.4, gone: 9.4, handsfree: true,
      parts: [
        { said: "เราต้องใช้ GPU ของ Nvidia เพื่อ train model", text: "เราต้องใช้ GPU ของ Nvidia เพื่อ train model", from: 1.2, to: 4.0, typed: 4.95 },
        { said: "แล้วค่อยเขียน code ด้วย Python", text: "แล้วค่อยเขียน code ด้วยไพทอน", from: 5.2, to: 7.3, typed: 8.4 },
      ],
    },
  ];
  const DURATION = SCENES.reduce((a, s) => a + s.len, 0);
  const PREVIEW_EVERY = 0.7, PREVIEW_TAKES = 0.25, PREVIEW_CHARS = 42;
  const seg = new Intl.Segmenter("th", { granularity: "word" });
  const wordsOf = s => [...seg.segment(s)].map(x => x.segment);

  const RED = [255, 69, 59], AMBER = [255, 179, 64], GREEN = [51, 214, 74];
  const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  const $ = id => document.getElementById(id);

  // The first `frac` of `text`, cut at a word boundary.
  function upTo(text, frac) {
    let out = "";
    for (const w of wordsOf(text)) {
      if (out.length + w.length > frac * text.length + 0.5) break;
      out += w;
    }
    return out;
  }

  // As src/overlay.rs preview_tail: the last 42 characters, after "…" if cut.
  function tail(text) {
    const c = [...text.trim()];
    if (c.length <= PREVIEW_CHARS) return c.join("");
    let from = c.length - PREVIEW_CHARS;
    while (from < c.length && /[ัิ-ฺ็-๎]/.test(c[from])) from++;
    return "…" + c.slice(from).join("");
  }

  // A speech-like microphone level (0..1): syllables at ~5 Hz, quiet between parts.
  function level(sc, u) {
    const p = sc.parts.find(p => u >= p.from - 0.1 && u <= p.to + 0.1);
    if (!p) return 0.05;
    const s = u - p.from;
    const syll = Math.abs(Math.sin(s * 15.7)) * (0.7 + 0.3 * Math.sin(s * 4.1 + 1));
    const phrase = 0.55 + 0.45 * Math.max(0, Math.sin(s * 2.1 + 0.9));
    return Math.min(1, 0.3 + 0.7 * syll * phrase);
  }

  // Bar heights as in src/overlay.rs (fraction of 24 px, at least the bar width).
  function bars(sc, u, phase, since) {
    const SHAPE = [0.55, 0.8, 1.0, 0.8, 0.55];
    return SHAPE.map((shape, i) => {
      if (phase === "listen") return 0.12 + 0.88 * level(sc, u) * shape * (0.75 + 0.25 * Math.sin(since * 9 + i * 1.3));
      if (phase === "work") return 0.15 + 0.45 * (0.5 + 0.5 * Math.sin(since * 6 - i * 0.9));
      return 0.15;
    });
  }

  // What the pill shows while listening (src/app.rs show_heard): the parts typed so far and
  // the newest preview of the part being said, which stays until that part is typed.
  function heard(sc, u) {
    const done = sc.parts.filter(p => u >= p.typed && sc.handsfree);
    const cur = sc.parts.find(p => !done.includes(p) && u >= p.from);
    let pending = "";
    if (cur) {
      // previews start every 0.7 s once the part has 1 s of audio, and take ~0.25 s
      const first = cur.from + 1.0;
      const n = Math.floor((u - PREVIEW_TAKES - first) / PREVIEW_EVERY);
      if (n >= 0) {
        const at = first + n * PREVIEW_EVERY;
        pending = upTo(cur.text, Math.min(1, (at - cur.from) / (cur.to - cur.from)));
      }
    }
    return [...done.map(p => p.text), pending].filter(Boolean).join(" ");
  }

  window.render = function (t) {
    t = ((t % DURATION) + DURATION) % DURATION;
    let start = 0, sc = SCENES[0];
    for (const s of SCENES) { if (t < start + s.len) { sc = s; break; } start += s.len; }
    const u = t - start;
    const [l0, l1] = sc.listen;
    const down = sc.key.some(([a, b]) => u >= a && u < b);
    const listening = u >= l0 && u < l1;
    const phase = u < l0 ? "idle" : u < l1 ? "listen" : u < sc.paste ? "work" : u < sc.gone ? "done" : "idle";

    $("scene").textContent = sc.title;
    $("doctitle").textContent = sc.doc;
    sc.steps.forEach((txt, i) => { $("s" + (i + 1)).querySelector("span").textContent = txt; });

    $("key").classList.toggle("down", down);
    $("mic").classList.toggle("on", listening);
    $("micg").setAttribute("fill", listening ? "#E53935" : "#FFFFFF");
    $("micring").setAttribute("stroke", listening ? "#E53935" : "#FFFFFF");

    // speech subtitle: the part being said, its words lighting up
    const p = sc.parts.find(p => u >= p.from - 0.1 && u < p.to + 0.5);
    $("speech").classList.toggle("hidden", !p);
    if (p) {
      const said = upTo(p.said, Math.max(0, Math.min(1, (u - p.from) / (p.to - p.from))));
      $("said").textContent = said;
      $("unsaid").textContent = p.said.slice(said.length);
    }

    // pill
    $("pill").classList.toggle("hidden", phase === "idle");
    if (phase !== "idle") {
      const rgb = phase === "listen" ? RED : phase === "work" ? AMBER : GREEN;
      const words = phase === "listen" ? heard(sc, u) : "";
      $("label").textContent = words ? tail(words)
        : phase === "listen" ? (sc.handsfree ? "กำลังฟัง… แตะ Right ⌥ อีกครั้งเพื่อจบ" : "กำลังฟัง…")
        : phase === "work" ? "กำลังถอดเสียง…" : "✓ พิมพ์แล้ว";
      const since = u - (phase === "listen" ? l0 : phase === "work" ? l1 : sc.paste);
      bars(sc, u, phase, since).forEach((h, i) => {
        const b = $("bars").children[i];
        b.style.height = Math.max(4, 24 * h) + "px";
        b.style.background = css(rgb);
      });
    }

    // the document: each part appears when the app types it, flashing briefly
    const typed = $("typed");
    typed.replaceChildren();
    sc.parts.filter(p => u >= p.typed).forEach((p, i) => {
      if (i > 0) typed.append(" ");
      const span = document.createElement("span");
      span.className = "part" + (u < p.typed + 0.45 ? " flash" : "");
      span.textContent = p.text;
      typed.append(span);
    });
    const blink = Math.floor(t * 2) % 2 === 0;
    $("caret").style.visibility = blink || listening || phase === "work" ? "visible" : "hidden";

    // steps
    const step = u < l0 ? 0 : u < l0 + 0.6 ? 1 : u < l1 ? 2 : u < sc.gone ? 3 : 4;
    ["s1", "s2", "s3"].forEach((id, i) => {
      $(id).classList.toggle("on", step === i + 1);
      $(id).classList.toggle("done", step > i + 1 && step < 4);
    });
  };
  window.DURATION = DURATION;
  render(0);
</script>
</body>
</html>
